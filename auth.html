<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Journal - Auth Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0B0E14',
                            card: '#121721',
                            border: '#1E2638',
                            hover: '#1A2232',
                            text: '#94A3B8',
                            textMuted: '#64748B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0E14;
            color: #E2E8F0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden bg-cover bg-center bg-no-repeat"
    style="background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=2000&q=80');">

    <!-- Dark Overlay with Gradient for Trading Chart Effect -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#0B0E14]/95 via-[#0B0E14]/85 to-[#051E1B]/90 z-0"></div>

    <!-- Auth Card Container with Glassmorphism -->
    <div
        class="relative z-10 w-full max-w-md bg-[#0B0E14]/80 backdrop-blur-md border border-emerald-500/20 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">

        <!-- Branding Header -->
        <div class="text-center space-y-2">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl mb-1 shadow-lg shadow-emerald-500/10">
                <i data-lucide="line-chart" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Trade Log Portal</h1>
            <p class="text-xs text-dark-textMuted">Access your trading journal and analytics dashboard</p>
        </div>

        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 p-1 bg-black/40 border border-dark-border rounded-xl">
            <button id="tab-signin-btn" onclick="switchTab('signin')"
                class="py-2 text-xs font-semibold rounded-lg text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 transition shadow-sm">
                Sign In
            </button>
            <button id="tab-signup-btn" onclick="switchTab('signup')"
                class="py-2 text-xs font-semibold rounded-lg text-dark-text hover:text-white transition">
                Sign Up
            </button>
        </div>

        <!-- Alert Banner -->
        <div id="auth-alert" class="hidden p-3 rounded-xl border text-xs font-medium flex items-center gap-2">
            <i id="alert-icon" data-lucide="info" class="w-4 h-4 shrink-0"></i>
            <span id="alert-text"></span>
        </div>

        <!-- Sign In Form -->
        <form id="signin-form" onsubmit="handleAuth(event, 'signin')" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-dark-text mb-1">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-dark-textMuted absolute left-3 top-3"></i>
                    <input type="email" id="signin-email" required placeholder="trader@example.com"
                        class="w-full bg-black/50 border border-dark-border rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-medium text-dark-text">Password</label>
                    <a href="#" onclick="alert('Password reset link feature can be enabled in Supabase settings.')"
                        class="text-[11px] text-emerald-400 hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-dark-textMuted absolute left-3 top-3"></i>
                    <input type="password" id="signin-password" required placeholder="••••••••"
                        class="w-full bg-black/50 border border-dark-border rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" id="signin-submit-btn"
                class="w-full py-2.5 text-sm font-semibold text-black bg-emerald-500 hover:bg-emerald-400 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" onsubmit="handleAuth(event, 'signup')" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-dark-text mb-1">Full Name</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-dark-textMuted absolute left-3 top-3"></i>
                    <input type="text" id="signup-name" required placeholder="John Doe"
                        class="w-full bg-black/50 border border-dark-border rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-dark-text mb-1">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-dark-textMuted absolute left-3 top-3"></i>
                    <input type="email" id="signup-email" required placeholder="trader@example.com"
                        class="w-full bg-black/50 border border-dark-border rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-dark-text mb-1">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-dark-textMuted absolute left-3 top-3"></i>
                    <input type="password" id="signup-password" minlength="6" required
                        placeholder="At least 6 characters"
                        class="w-full bg-black/50 border border-dark-border rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" id="signup-submit-btn"
                class="w-full py-2.5 text-sm font-semibold text-black bg-emerald-500 hover:bg-emerald-400 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <span>Create Account</span>
                <i data-lucide="user-plus" class="w-4 h-4"></i>
            </button>
        </form>

    </div>

    <script>
        const SUPABASE_URL = "https://hgtlatmntilgyijyyqnu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_OqD5ksBvDVMePF1gv3s-PQ_PM5hQGnF";

        let supabaseClient = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (!SUPABASE_URL.includes('YOUR_SUPABASE') && SUPABASE_KEY) {
                try {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } catch (e) {
                    console.error('Supabase init error:', e);
                }
            }
        });

        function switchTab(tab) {
            hideAlert();
            const signinBtn = document.getElementById('tab-signin-btn');
            const signupBtn = document.getElementById('tab-signup-btn');
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');

            if (tab === 'signin') {
                signinBtn.className = "py-2 text-xs font-semibold rounded-lg text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 transition shadow-sm";
                signupBtn.className = "py-2 text-xs font-semibold rounded-lg text-dark-text hover:text-white transition";
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupBtn.className = "py-2 text-xs font-semibold rounded-lg text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 transition shadow-sm";
                signinBtn.className = "py-2 text-xs font-semibold rounded-lg text-dark-text hover:text-white transition";
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
            }
        }

        async function handleAuth(e, type) {
            e.preventDefault();
            hideAlert();

            if (!supabaseClient) {
                showAlert('Please configure SUPABASE_URL and SUPABASE_KEY in the script tag.', 'error');
                return;
            }

            if (type === 'signin') {
                const email = document.getElementById('signin-email').value;
                const password = document.getElementById('signin-password').value;

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showAlert(error.message, 'error');
                } else {
                    showAlert('Sign in successful! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                }
            } else if (type === 'signup') {
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: name } }
                });

                if (error) {
                    showAlert(error.message, 'error');
                } else {
                    showAlert('Account created! Check your email to verify.', 'success');
                }
            }
        }

        function showAlert(msg, type) {
            const banner = document.getElementById('auth-alert');
            const text = document.getElementById('alert-text');
            banner.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');

            if (type === 'error') {
                banner.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
            } else {
                banner.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
            }

            text.innerText = msg;
            banner.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('auth-alert').classList.add('hidden');
        }
    </script>
</body>

</html>
